networks:
  studio-net:
    name: studio-net
    external: true

volumes:
  uptime-kuma-data:

services:
  # server and client are NOT run in Docker — local dev uses `run.sh`
  # (native uvicorn + Vite dev server), and if a production-style build is
  # ever needed, it's run directly on the host (`pnpm build` for the
  # client, `uv run uvicorn ...` for the server), not containerized.
  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    volumes:
      - uptime-kuma-data:/app/data
    ports:
      - "3001:3001"
    networks:
      - studio-net
