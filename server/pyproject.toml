[project]
name = "nithin-studio-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.54",
    "fastapi>=0.139.2",
    "gfpgan>=1.3.8",
    "imagehash>=4.3.2",
    "insightface>=1.0.1",
    "onnxruntime>=1.27.0",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "realesrgan>=0.3.0",
    "sse-starlette>=3.4.6",
    "torch>=2.13.0",
    "transformers>=5.14.1",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
