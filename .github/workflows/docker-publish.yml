name: Publish Docker images

# Runs only on main — not every push should republish `:latest`. Pulling
# these images locally (docker-compose.yml) is meant as a "run a known-good
# build" path, separate from day-to-day dev (which uses run.sh and never
# touches Docker at all).
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: nithin_studio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://studio:changeme@localhost:5432/nithin_studio
      CLIENT_ORIGIN: http://localhost:5173
      FILE_MANAGER_DATABASE_URL: postgresql://studio:changeme@localhost:5432/file_manager
      FILE_MANAGER_S3_ENDPOINT_URL: http://localhost:9000
      FILE_MANAGER_S3_ACCESS_KEY: studio
      FILE_MANAGER_S3_SECRET_KEY: changeme123
      FILE_MANAGER_S3_BUCKET: file-manager
      LORA_TRAINER_DATABASE_URL: postgresql://studio:changeme@localhost:5432/lora_trainer
      LORA_TRAINER_UPLOADS_DIR: /tmp/lora-trainer-uploads
      LORA_TRAINER_AWS_REGION: us-east-1
      LORA_TRAINER_S3_BUCKET: dummy-bucket
      LORA_TRAINER_INSTANCE_PROFILE_ARN: arn:aws:iam::000000000000:instance-profile/dummy
      LORA_TRAINER_SECURITY_GROUP_ID: sg-dummy
      LORA_TRAINER_SUBNET_ID: subnet-dummy
      LORA_TRAINER_AWS_ACCESS_KEY_ID: dummy
      LORA_TRAINER_AWS_SECRET_ACCESS_KEY: dummy
      LORA_TRAINER_AMI_ID: ami-dummy
      IMAGE_GENERATOR_DATABASE_URL: postgresql://studio:changeme@localhost:5432/image_generator
      IMAGE_GENERATOR_AWS_REGION: us-east-1
      IMAGE_GENERATOR_AWS_ACCESS_KEY_ID: dummy
      IMAGE_GENERATOR_AWS_SECRET_ACCESS_KEY: dummy
      IMAGE_GENERATOR_SECURITY_GROUP_ID: sg-dummy
      IMAGE_GENERATOR_SUBNET_ID: subnet-dummy
      IMAGE_GENERATOR_INFERENCE_TOKEN: dummy
    steps:
      - uses: actions/checkout@v4

      - name: Start MinIO
        # Run directly (not as a GH Actions `services:` container) — the
        # official minio/minio image needs `server /data` as its command,
        # and `services:` has no clean way to override a container's
        # command/entrypoint. This also avoids depending on Bitnami's
        # image at all, whose free tags have been unstable/disappearing.
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=studio -e MINIO_ROOT_PASSWORD=changeme123 \
            minio/minio server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 1
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Client — install
        working-directory: client
        run: pnpm install --frozen-lockfile
      - name: Client — lint
        working-directory: client
        run: pnpm lint
      - name: Client — typecheck + build
        working-directory: client
        run: pnpm build
      - name: Client — test
        working-directory: client
        run: pnpm test

      - uses: astral-sh/setup-uv@v3
      - name: Server — install
        working-directory: server
        run: uv sync --frozen
      - name: Server — lint
        working-directory: server
        run: uv run ruff check .
      - name: Server — test
        working-directory: server
        run: uv run pytest

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        id: version
        # 0.0.0, 0.0.1, ... 0.0.99, then 0.1.0, 0.1.1, ... — derived from
        # the workflow's own auto-incrementing run number, not a file/tag
        # committed back to the repo. Note this can have gaps: a run whose
        # `test` job fails still consumes a run_number without ever
        # reaching this step, so a version number here and there may never
        # get published — same as build-number gaps in any CI system.
        run: |
          minor=$(( ${{ github.run_number }} / 100 ))
          patch=$(( ${{ github.run_number }} % 100 ))
          echo "version=0.$minor.$patch" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nithin-studio-server:latest
            ghcr.io/${{ github.repository_owner }}/nithin-studio-server:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/nithin-studio-server:${{ steps.version.outputs.version }}

      - uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          # Baked into the built JS bundle at build time (Vite env vars are
          # compile-time, not runtime) — must match the host port
          # docker-compose.yml maps the *published* server image to (8080),
          # not client/.env's committed value (8000, for run.sh's server).
          build-args: |
            VITE_API_URL=http://localhost:8080
          tags: |
            ghcr.io/${{ github.repository_owner }}/nithin-studio-client:latest
            ghcr.io/${{ github.repository_owner }}/nithin-studio-client:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/nithin-studio-client:${{ steps.version.outputs.version }}
